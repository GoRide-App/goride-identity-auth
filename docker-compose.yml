services:
  goride-api:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
      
  identity-auth:
    build: .
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__Default: "Server=mysql;Database=identity_auth;User=identity_svc;Password=${DB_PASSWORD};"
      Asgardeo__Authority: "${ASGARDEO_AUTHORITY}"
      Asgardeo__ClientId: "${ASGARDEO_CLIENT_ID}"
      Asgardeo__ClientSecret: "${ASGARDEO_CLIENT_SECRET}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: identity_auth
      MYSQL_USER: identity_svc
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: