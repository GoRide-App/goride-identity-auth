services:
  identity-auth:
    build: .
    ports:
      - "5001:8080"
    environment:
      # Keys must match what Program.cs reads: ConnectionStrings:DefaultConnection, Asgardeo:BaseUrl, ...
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=identity_auth;User=identity_svc;Password=${DB_PASSWORD};"
      Asgardeo__BaseUrl: "${ASGARDEO_BASE_URL}"
      Asgardeo__ClientId: "${ASGARDEO_CLIENT_ID}"
      Asgardeo__ClientSecret: "${ASGARDEO_CLIENT_SECRET}"
      AsgardeoMgmt__ClientId: "${ASGARDEO_MGMT_CLIENT_ID}"
      AsgardeoMgmt__ClientSecret: "${ASGARDEO_MGMT_CLIENT_SECRET}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: identity_auth
      MYSQL_USER: identity_svc
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
