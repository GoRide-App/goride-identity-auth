name: CD

# Nothing is deployed to a cloud environment yet, so this pipeline stops at a
# published, versioned container image in GitHub Container Registry. That gives
# QA a fixed artefact to pull and test, and the deploy job is already wired up
# for the day the Azure Container App from the devops branch actually exists.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Attempt the deploy step (needs AZURE_CREDENTIALS to be set)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  package:
    name: Publish build artefact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish src/GoRide.IdentityAuth.csproj -c Release -o ./publish

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: goride-identity-auth-${{ github.sha }}
          path: ./publish
          retention-days: 30

  image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Dockerfile::main does not carry a Dockerfile yet, so no image was pushed. Merge dev into main to enable this."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token — no secret needs to be created for this.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.present }}" = "true" ]; then
            {
              echo "## Image published"
              echo ""
              echo '```'
              echo "docker pull ${{ env.IMAGE }}:${{ github.sha }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Image skipped"
              echo ""
              echo "No Dockerfile on this branch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: image
    # Only attempts a deploy when a target has actually been provisioned and
    # the AZURE_CREDENTIALS secret exists. Until then this job reports and exits
    # green rather than failing every push to main.
    steps:
      - name: Check deployment target
        id: target
        env:
          # Compared as a boolean so the secret value itself is never expanded
          # into a shell command.
          HAS_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}
          APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
        run: |
          if [ -z "$APP_NAME" ] || [ "$HAS_CREDENTIALS" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No deployment target::No environment is provisioned yet. Set the AZURE_CONTAINERAPP_NAME / AZURE_RESOURCE_GROUP repository variables and the AZURE_CREDENTIALS secret to enable this job."
            {
              echo "## Deploy"
              echo ""
              echo "Skipped — no environment provisioned yet."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        if: steps.target.outputs.ready == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        if: steps.target.outputs.ready == 'true'
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          imageToDeploy: ${{ env.IMAGE }}:${{ github.sha }}
