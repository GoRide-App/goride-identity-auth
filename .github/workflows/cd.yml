name: CD

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: goride-identity-auth
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}

jobs:
# 1. Run the complete CI pipeline first
  ci:
    name: CI
    uses: ./.github/workflows/ci-reusable.yml
    permissions:
      contents: read

# 2. Build and push only if CI succeeds
  image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login \
            --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Show image
        run: |
          echo "Image:"
          echo "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

# 3. Deploy only if image push succeeds
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: image

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          
      - name: Verify Azure context
        run: |
          echo "=== Azure Account ==="
          az account show \
            --query "{Subscription:name,SubscriptionId:id,TenantId:tenantId}" \
            -o table
  
          echo "=== Resource Group ==="
          az group show \
            --name "${{ env.RESOURCE_GROUP }}" \
            -o table
  
          echo "=== Container App ==="
          az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "{Name:name,ResourceGroup:resourceGroup,Environment:managedEnvironmentId}" \
            -o table

      - name: Deploy image
        run: |
          IMAGE_URI="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          # Check if container app exists
          if az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" &>/dev/null; then
            # Update existing app
            az containerapp update \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "$IMAGE_URI" \
              --set-env-vars ASPNETCORE_ENVIRONMENT=Production
          else
            # Create new app
            az containerapp create \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "$IMAGE_URI" \
              --environment goride-env \
              --target-port 8080 \
              --registry-login-server "${{ env.ACR_LOGIN_SERVER }}" \
              --registry-username '${{ secrets.AZURE_ACR_USERNAME }}' \
              --registry-password '${{ secrets.AZURE_ACR_PASSWORD }}'
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment successful." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
