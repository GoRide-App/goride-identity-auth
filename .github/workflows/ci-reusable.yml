name: CI

# Runs on every pull request into main/dev, and on direct pushes to those
# branches. This is the QA gate: nothing merges into main unless it is green.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: |
          set -o pipefail
          dotnet build --no-restore -c Release 2>&1 | tee build.log

      - name: Summarise build warnings
        if: always()
        run: |
          COUNT=$(grep -c ": warning " build.log || true)
          {
            echo "## Build"
            echo ""
            echo "Compiler warnings: **${COUNT}**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${COUNT}" != "0" ]; then
            {
              echo ""
              echo '```'
              grep ": warning " build.log | sed 's|^/home/runner/work/[^/]*/[^/]*/||' | sort -u | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # There is no test project in the repo yet. Rather than let `dotnet test`
      # pass trivially and report a false green, detect it and say so out loud.
      - name: Detect test projects
        id: detect
        run: |
          FOUND=$(grep -rlE 'Microsoft\.NET\.Test\.Sdk|xunit|NUnit|MSTest\.TestFramework' --include='*.csproj' . || true)
          if [ -n "${FOUND}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Test projects found:"; echo "${FOUND}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test with coverage
        if: steps.detect.outputs.found == 'true'
        run: |
          dotnet test --no-build -c Release \
            --logger "trx;LogFileName=results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: No tests present
        if: steps.detect.outputs.found != 'true'
        run: |
          echo "::warning title=No automated tests::This repository has no test project, so the test step was skipped. Coverage is 0%."
          {
            echo ""
            echo "## Tests"
            echo ""
            echo ":warning: **No test project found.** The test step was skipped rather than reported as passing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always() && steps.detect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      # Advisory for now: the existing branches have whitespace violations that
      # would block every PR. Fix them with `dotnet format`, then flip this to
      # blocking by deleting the `continue-on-error` line.
      - name: Formatting check
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet format --verify-no-changes --no-restore 2>&1 | tee format.log

      - name: Summarise formatting
        if: always()
        run: |
          if [ "${{ steps.format.outcome }}" = "success" ]; then
            {
              echo "## Formatting"
              echo ""
              echo ":white_check_mark: Code is correctly formatted."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Formatting::Run 'dotnet format' locally and commit the result."
            {
              echo "## Formatting"
              echo ""
              echo ":warning: **Formatting violations found** — run \`dotnet format\` locally and commit."
              echo ""
              echo '```'
              grep -E "error WHITESPACE|error IDE" format.log | head -30 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Blocking: a known-vulnerable dependency should stop a merge.
      - name: Vulnerable NuGet packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.log
          if grep -q "has the following vulnerable packages" vuln.log; then
            echo "::error title=Vulnerable dependency::A NuGet package with a known CVE is referenced."
            {
              echo "## Dependencies"
              echo ""
              echo ":x: **Vulnerable packages found**"
              echo ""
              echo '```'
              cat vuln.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## Dependencies"
            echo ""
            echo ":white_check_mark: No known-vulnerable packages."
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory: deprecated packages are worth knowing about but not worth
      # blocking a merge over.
      - name: Deprecated NuGet packages
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet list package --deprecated --include-transitive 2>&1 | tee deprecated.log
          if grep -q "has the following deprecated packages" deprecated.log; then
            echo "::warning title=Deprecated dependency::A deprecated NuGet package is referenced."
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # main does not carry the Dockerfile yet (it only exists on dev and the
      # feature branches), so skip cleanly instead of failing red.
      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No Dockerfile::Skipping the image build on this branch."
          fi

      - name: Build image (no push)
        if: steps.check.outputs.present == 'true'
        run: docker build -t goride-identity-auth:ci .

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [build-test, quality, docker]
    if: always()
    steps:
      - name: Evaluate
        run: |
          echo "build-test : ${{ needs.build-test.result }}"
          echo "quality    : ${{ needs.quality.result }}"
          echo "docker     : ${{ needs.docker.result }}"
          FAILED=0
          for r in "${{ needs.build-test.result }}" "${{ needs.quality.result }}" "${{ needs.docker.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) FAILED=1 ;;
            esac
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error title=CI failed::One or more required jobs did not pass."
            exit 1
          fi
          echo "All required jobs passed."